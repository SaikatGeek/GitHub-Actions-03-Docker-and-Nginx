name: Docker With Nginx

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  docker:
    if: github.event.pull_request.merged == true
    name: Docker de
    runs_on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t myimage:test .

      - name: Test Docker Image
        run: |
          docker run -d -p 8080:80 --name test-nginx myimage:test 
          sleep 5
          curl http://localhost:8080 | grep "Hello from GitHub Actions!"
          docker stop test-nginx


      - name: Docker Image push
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/mynginx
        run: |
          docker tag test-nginx $IMAGE:latest
          docker push $IMAGE:latest

